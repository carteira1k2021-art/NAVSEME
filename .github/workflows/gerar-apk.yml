name: Gerar APK Android 4.1.1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Baixar e Instalar Android SDK Manualmente
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -s https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          mkdir -p latest/bin

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses
          sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Compilar e Assinar APK para Android 4.1.1 (API 16)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/28.0.3"
          PLATFORM="$ANDROID_HOME/platforms/android-28/android.jar"
          
          mkdir -p build/gen build/obj build/apk
          
          # Empacotar recursos
          $BUILD_TOOLS/aapt package -f -m \
            -J build/gen \
            -M app/src/main/AndroidManifest.xml \
            -A app/src/main/assets \
            -I $PLATFORM
            
          # Compilar Java em compatibilidade com Android 4.1.1
          javac -encoding UTF-8 -source 1.7 -target 1.7 \
            -bootclasspath $PLATFORM \
            -d build/obj \
            app/src/main/java/br/gov/sp/carapicuiba/semeti/MainActivity.java
            
          # Converter para Dalvik (.dex) compatível com Android 4.1.1
          $BUILD_TOOLS/dx --dex --output=build/apk/classes.dex build/obj
          
          # Criar APK bruto
          $BUILD_TOOLS/aapt package -f \
            -M app/src/main/AndroidManifest.xml \
            -A app/src/main/assets \
            -I $PLATFORM \
            -F build/seme-unaligned.apk
            
          cd build/apk
          $BUILD_TOOLS/aapt add ../seme-unaligned.apk classes.dex
          cd ../..
          
          # Alinhar APK
          $BUILD_TOOLS/zipalign -f 4 build/seme-unaligned.apk build/seme-aligned.apk
          
          # Criar chave e assinar com assinatura v1 (obrigatória para Android 4.1.1)
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SEME-TI, OU=TI, O=Carapicuiba, L=SP, S=SP, C=BR"
            
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled false \
            --out SEME-TI-Navegador.apk build/seme-aligned.apk

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: APK-SEME-TI-Android-4.1.1
          path: SEME-TI-Navegador.apk
